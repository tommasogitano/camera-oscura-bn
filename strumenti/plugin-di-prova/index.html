<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Prova di caricamento</title>
  <style>
    body { font-family: sans-serif; font-size: 12px; padding: 12px; color: #d6d6d6; }
    #esito { margin-top: 8px; }
  </style>
</head>
<body>
  <div>Se leggi questo, UXP carica i plugin correttamente.</div>
  <div id="esito">Verifica in corso…</div>

  <script>
    (function () {
      try {
        require("uxp").entrypoints.setup({
          panels: {
            pannelloProva: { create: function () {}, show: function () {}, hide: function () {}, destroy: function () {} }
          }
        });
      } catch (e) {
        console.error(e);
      }
      try {
        var app = require("photoshop").app;
        document.getElementById("esito").textContent =
          "Photoshop raggiungibile. Documenti aperti: " + app.documents.length;
      } catch (e) {
        document.getElementById("esito").textContent = "Errore nel modulo photoshop: " + e.message;
      }
    })();
  </script>
</body>
</html>
